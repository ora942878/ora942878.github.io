<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jiajun Sun</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      flex-direction: column;
    }

    .scene {
      width: 160px;
      height: 160px;
      perspective: 600px;
      margin-bottom: 40px;
    }

    .cube {
      width: 160px;
      height: 160px;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 8s infinite linear;
    }

    .face {
      position: absolute;
      width: 160px;
      height: 160px;
      background: rgba(176, 17, 42, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .front  { transform: rotateY(0deg) translateZ(80px); }
    .back   { transform: rotateY(180deg) translateZ(80px); }
    .right  { transform: rotateY(90deg) translateZ(80px); }
    .left   { transform: rotateY(-90deg) translateZ(80px); }
    .top    { transform: rotateX(90deg) translateZ(80px); }
    .bottom { transform: rotateX(-90deg) translateZ(80px); }

    @keyframes rotateCube {
      from {
        transform: rotateX(0deg) rotateY(0deg);
      }
      to {
        transform: rotateX(360deg) rotateY(360deg);
      }
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    p {
      color: #ccc;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <div class="scene">
    <div class="cube">
      <div class="face front">ABAW</div>
      <div class="face back">EXPR</div>
      <div class="face right">DINOv2</div>
      <div class="face left">Audio</div>
      <div class="face top">Fusion</div>
      <div class="face bottom">FER</div>
    </div>
  </div>

  <h1>Jiajun Sun</h1>
  <p>Master's Student · Affective Computing · Facial Expression Recognition</p>
</body>
</html>
